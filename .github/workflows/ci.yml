name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支的新提交会取消上一次未完成的运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试与覆盖率
        run: npm run test:coverage

      # 私有仓库只在主仓库的 main 推送后上传，派生仓库的 PR 保留本地报告。
      - name: 上传覆盖率到 Codecov
        if: github.repository == 'cohesion-dev/NQQ' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: 展示覆盖率指标
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          let summary = '## 单元测试覆盖率\n\n| 指标 | 覆盖率 | 已覆盖 / 总数 |\n| --- | ---: | ---: |\n';
          for (const [key, label] of [['lines', '行'], ['statements', '语句'], ['functions', '函数'], ['branches', '分支']]) {
            const metric = total[key];
            summary += `| ${label} | ${metric.pct}% | ${metric.covered} / ${metric.total} |\n`;
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: 构建
        run: npm run build

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 启动开发服务器
        run: |
          npm run dev > /tmp/dev-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ > /dev/null

      - name: 浏览器检查
        run: npm run test:browser

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
